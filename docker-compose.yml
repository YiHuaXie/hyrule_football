services:
  # 主应用（飞书客户端 + Agent）
  app:
    build: .
    container_name: hyrule_football_app
    restart: always
    depends_on:
      - redis
      # - mcp_server
    env_file:
      - .env
    environment:
      - APP_ENV=release
      - LOG_FILE=app.log
      - TZ=Asia/Shanghai
      - REDIS_DEFAULT_URL=redis://redis:6379/0
      # 混合部署：MCP Server 和主应用在同一容器，使用 localhost
      # - MCP_SERVER_URL=http://localhost:8001
    volumes:
      - ./logs:/app/logs
    # command: ["python", "-m", "hyrule_football.main"]
    dns:
      - 8.8.8.8
      - 8.8.4.4
    sysctls:
      - net.ipv4.tcp_mtu_probing=1
    networks:
      - host_network

  redis:
    image: redis/redis-stack-server:latest
    container_name: hyrule_football_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/var/lib/redis-stack
    networks:
      - host_network
    command: >
      redis-stack-server
      --appendonly yes
      --appendfsync everysec
      --save "300 1"

networks:
  host_network:
    driver: bridge

volumes:
  redis_data:
    driver: local