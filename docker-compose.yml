services:
  app:
    build: .
    container_name: hyrule_football_app
    restart: always
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - APP_ENV=release
      - LOG_FILE=app.log
      - TZ=Asia/Shanghai
      - REDIS_DEFAULT_URL=redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
    dns:
      - 8.8.8.8
      - 8.8.4.4
    sysctls:
      - net.ipv4.tcp_mtu_probing=1
    networks:
      - host_network

  redis:
    image: redis/redis-stack-server:latest
    container_name: hyrule_football_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - host_network
    command: redis-stack-server

networks:
  host_network:
    driver: bridge

volumes:
  redis_data:
    driver: local