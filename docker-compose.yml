services:
  # 主应用（飞书客户端 + Agent）
  app:
    build: .
    container_name: hyrule_football_app
    restart: always
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - APP_ENV=release
      - LOG_FILE=app.log
      - TZ=Asia/Shanghai
      - REDIS_DEFAULT_URL=redis://redis:6379/0
      - MYSQL_DB_URL=mysql+asyncmy://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      # 混合部署：MCP Server 和主应用在同一容器，使用 localhost
      # - MCP_SERVER_URL=http://localhost:8001
    volumes:
      - ./logs:/app/logs
    # command: ["python", "-m", "hyrule_football.main"]
    dns:
      - 8.8.8.8
      - 8.8.4.4
    sysctls:
      - net.ipv4.tcp_mtu_probing=1
    networks:
      - host_network

  redis:
    image: redis/redis-stack-server:latest
    container_name: hyrule_football_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/var/lib/redis-stack
    networks:
      - host_network
    command: >
      redis-stack-server
      --appendonly yes
      --appendfsync everysec
      --save "300 1"
  mysql:
    image: mysql:8.0
    container_name: hyrule_football_db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      TZ: Asia/Shanghai

    volumes:
      - mysql_data:/var/lib/mysql  # 数据持久化

    ports:
      - "${MYSQL_PORT:-3306}:3306"

    networks:
      - host_network

    healthcheck: 
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      
networks:
  host_network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  mysql_data:
    driver: local