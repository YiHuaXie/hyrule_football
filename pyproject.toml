[project]
name = "hyrule_football"
version = "0.1.0"
description = "A LangChain-based football analysis project"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "langchain (>=1.1.0,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "langchain-deepseek (>=1.0.1,<2.0.0)",
    "langchain-openai (>=1.1.0,<2.0.0)",
    "pydantic (>=2.12.4,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "beautifulsoup4 (>=4.14.2,<5.0.0)",
    "lark-oapi (>=1.4.24,<2.0.0)",
    "dashscope (>=1.25.2,<2.0.0)",
    "langchain-mcp-adapters (>=0.1.14,<0.2.0)",
    "apscheduler (>=3.11.1,<4.0.0)",
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.poetry]
name = "hyrule_football"
version = "0.1.0"
package-mode = true

packages = [
    { include = "hyrule_football" }
]